server:
  port: 9000

spring:
  datasource:
    url: jdbc:h2:mem:notification
    driver-class-name: org.h2.Driver
    username: sa
  #   password: password

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

    hibernate:
      ddl-auto: create

    show-sql: true

    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  application:
    name: notification